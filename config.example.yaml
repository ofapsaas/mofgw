# mofgw — config de ejemplo (copiar a ~/.config/mofgw/config.yaml)
# Las API keys NUNCA van en este archivo: solo referencias a variables
# de entorno (api_key_env), resueltas al arrancar.
#
# Generar hashes de client keys con:  mofgw hash-key <key>
# (o: echo -n <key> | mofgw hash-key)

server:
  addr: "127.0.0.1:3369"      # bind loopback por defecto (auth de todos modos)
  max_body_bytes: 10485760     # 10MB
  read_timeout: 120s
  write_timeout: 300s
  # max_sessions_retained: 100   # retención de sesiones (008-003) y tope del
  #                               # AffinityStore del sticky routing (009-002, default 100)

fallback:
  max_retries: 2               # intentos totales por request = max_retries + 1
  # inter_attempt_delay: retardo entre intentos de la cadena ante fallos
  # transitorios (timeout/network/connect/I-O/EOF pre-primer-byte) cuando el
  # siguiente provider COMPARTE base_url con el que falló (SPOF de cuentas del
  # mismo proveedor) (015-001). Se duerme N antes del siguiente intento para dar
  # tiempo al endpoint a recuperarse. NO aplica en 429 (cuota: salto inmediato).
  # ctx-aware (aborta si el cliente cancela). Default 0 = off (sin delay, cero
  # regresión).
  # inter_attempt_delay: 1s
  cooldown: 60s                # cooldown global por provider tras fallo retryable
  cooldown_jitter: 5s          # ± jitter anti thundering-herd
  timeout: 120s                # timeout global por intento (Complete; TTFB si no hay first_token_timeout)
  # first_token_timeout: 90s   # tope TTFB de STREAMING por intento (029-001/TECHDEBT #29):
                               # si un upstream no emite el primer token en N, aborta el intento
                               # y rota al siguiente provider (cadena circular). 0 = sin tope
                               # (el intento espera el primer byte indefinidamente). Default 90s.
                               # NO aplica a Complete (ahí manda timeout: la respuesta completa
                               # es el "primer byte").
  # Afinidad de provider por sesión/cliente (009-002): con enabled: true,
  # el provider que ganó el último request exitoso de una sesión se prueba
  # primero en el siguiente (maximiza cache hit del provider). Transparente:
  # respeta cooldown/health/cadena — solo reordena post-filtro. El tope de
  # entradas se gobierna con server.max_sessions_retained (default 100).
  sticky_routing:
    enabled: false

# Orden de providers = orden de la cadena de fallback (editar el orden
# acá ES la configuración del fallback).
providers:
  - id: provider-a
    base_url: "https://api.provider-a.example.com/v1"
    api_key_env: MOFGW_PROVIDER_A_KEY
    models: ["deepseek-v4-flash", "deepseek-v4-pro"]
    max_tokens: 8192
    # thinking_path: "zen"   # path de inyección del thinking_default (010-002).
    #                        # Valores: "" (default, sin inyección) | "zen" | "bailian".
    #                        # "zen" = reasoning_effort passthrough; "bailian" =
    #                        # reasoning_effort + enable_thinking (deepseek/glm) o
    #                        # enable_thinking solo (qwen). kimi/minimax nunca se
    #                        # inyectan (thinking siempre-on / nativo == prescriptivo).
    # cooldown: 90s    # override por provider (opcional)
    # timeout: 60s     # override por provider (opcional)
    # first_token_timeout: 45s  # override per-provider del tope TTFB de streaming
    #                           # (029-001/TECHDEBT #29; nil = usa fallback.first_token_timeout)
  - id: provider-b
    base_url: "https://api.provider-b.example.com/compatible-mode/v1"
    api_key_env: MOFGW_PROVIDER_B_KEY
    models: ["qwen3.7-plus", "glm-5.2"]
    max_tokens: 65536
  # Provider subprocess (013-003): ejecuta el CLI de un backend de IA como
  # subproceso en vez de hablar HTTP. NO usa base_url/api_key_env (claude usa
  # OAuth/suscripción). Los requests se serializan por sesión del cliente.
  # ⚠️ Si el config loader reclama base_url/api_key_env para un provider
  # type: subprocess, estás corriendo un binario mofgw VIEJO (sin el código
  # del epic 013) — recompilá/redesplegá con la fuente actual. El binario
  # nuevo valida type:subprocess sin esos campos.
  - id: provider-claude-cli
    type: subprocess
    backend: claude          # backend del motor ("claude" hoy; gemini/codex a futuro).
                             # != "claude" → error de carga (unknown backend).
    command: "claude"        # binario del CLI (default "claude").
    # session_dir: "~/.config/mofgw/sessions"  # base de sesiones (default).
    models: ["claude-sonnet-4"]
    max_tokens: 8192
    # backend_flags: flags OPACOS que se agregan tal cual al argv del CLI
    # claude (control de tools/permisos — opcional, ver ejemplos abajo).
    # ⚠️ El CLI claude ya incluye fijos: -p, -n/--resume <cliente>, --model,
    #    --output-format stream-json --verbose. Estos son REQUERIDOS para que
    #    mofgw funcione — NO los agregues acá. Acá van solo los de permisos/tools.
    #
    # Ejemplos de control de tools/permisos (v2.1.229):
    # 1) Restringir a read-only (claude NO usa Bash/Edit/Write):
    #    backend_flags: ["--permission-mode", "strict", "--disallowedTools", "Bash,Edit,Write"]
    # 2) Permitir SOLO un set explícito de tools:
    #    backend_flags: ["--allowedTools", "Read,WebSearch"]
    # 3) Sin restricción adicional (claude usa su config default, puede
    #    ejecutar Bash/Edit si el agente se lo pide):
    #    backend_flags: []
    # ⚠️ NO uses "--dangerously-skip-permissions" salvo que entiendas el riesgo:
    #    desactiva TODOS los permisos de claude (ejecuta cualquier comando).
    # backend_flags: ["--permission-mode", "strict", "--disallowedTools", "Bash,Edit,Write"]
    # clients: ["agent-main"]  # allowlist de clientID con acceso (013-003 P8).
    #                          # Vacío/ausente = SIN restricción (P9) + warning.

# Clientes autorizados (agentes). keys_sha256 = `mofgw hash-key <key>`.
clients:
  - id: agent-main
    key_sha256: "<sha256 hex de la key del agente principal>"
    # budget: límite de consumo por cliente (008-002). 0 = sin límite.
    # window es documentación (ventana simple desde el arranque).
    # budget:
    #   cost_usd_max: 5.0
    #   tokens_max: 10000000
    #   window: 24h
    # embeddings: modelo de embeddings FORZADO por cliente (011-006, P3).
    # mofgw ignora el `model` que manda Odoo y usa este. Sin él → 400.
    # embeddings:
    #   model: "all-minilm"
  - id: cron-daily
    key_sha256: "<sha256 hex de la key del cron>"

# Precios por millón de tokens por modelo (006-002). Valores USD.
# Sin entrada → costo 0 para ese modelo. Verificar precios vigentes
# (research-token-efficiency.md §1 — las tasas dependen del provider
# real: Zen vs Alibaba directo).
pricing:
  # Go service (opencode.ai/zen/go/v1): tasas del servicio GO de opencode
  # (NO Zen — verificado 11 Ago). deepseek-v4-flash 0.14/0.28, cached 0.0028.
  deepseek-v4-flash:
    input_usd_per_m: 0.14
    output_usd_per_m: 0.28
    cache_hit_usd_per_m: 0.0028
  qwen3.7-plus:
    input_usd_per_m: 0.40
    output_usd_per_m: 1.60
    cache_hit_usd_per_m: 0.04

# Metadata de capabilities por modelo (007-001). Alimenta /v1/models.
# Datos verificados en research-token-efficiency.md §4.
#
# thinking_default es PRESCRIPTIVO (ADR-003): documenta el effort de
# razonamiento que los agentes DEBEN enviar para este modelo; puede diferir
# del default nativo del modelo (research-token-efficiency.md §4). El gateway
# lo inyecta cuando el cliente no especifica (010-002).
# supported_parameters y modality son DECLARATIVOS (fallback rule): si un
# modelo no los declara, se OMITEN del catálogo /v1/models (zero-value →
# ausente).
model_metadata:
  deepseek-v4-flash:
    context_window: 1000000
    max_output: 384000
    thinking: ["low", "high", "max"]
    thinking_default: "low"
    supported_parameters: ["tools", "reasoning"]
    modality: "text->text"
  kimi-k2.7-code:
    context_window: 262144
    max_output: 32768
    thinking: ["always"]
    thinking_default: "always"
    supported_parameters: ["tools", "reasoning"]
    modality: "text+image+video->text"
  qwen3.7-plus:
    context_window: 1000000
    max_output: 131072
    thinking: ["high"]
    thinking_default: "high"
    supported_parameters: ["tools", "reasoning"]
    modality: "text+image+video->text"
  # Modelo subprocess (013-003 P6): NO declara "tools" en supported_parameters
  # — el provider subprocess las omite en el request path (D4) y el catálogo
  # lo marca no-tools. La metadata es declarativa (nunca se adivina).
  claude-sonnet-4:
    context_window: 200000
    max_output: 32000
    supported_parameters: ["reasoning"]
    modality: "text->text"

# Rechazo temprano por ventana de contexto (008-001).
# margin: fracción 0-1 sobre context_window (default 0.1).
context:
  margin: 0.1
  # Análisis estructural del contexto por sesión/cliente (009-001).
  # Expone GET /v1/context con la composición de cada sesión (roles,
  # part types, tokens estimados/actuales). SOLO metadata estructural,
  # nunca contenido. enabled=false (default) → endpoint 200 vacío, sin
  # memoria. history_per_session: ring buffer de entries por record
  # (0 = sin history, solo agregados).
  analysis:
    enabled: false
    history_per_session: 50

# Web search server-side (011-005): grounded search emulado con DuckDuckGo.
# Cuando Odoo manda {"type":"web_search_preview"} en tools, mofgw deriva la
# query del último mensaje user, busca en DDG e inyecta los resultados como
# un system message prependido (sin url_citation). enabled=false (default)
# → `web_search_preview` conserva el 400 de D3 de 003 (sin regresión).
# Fallo de DDG = best-effort (prosigue sin grounding, nunca 4xx/5xx).
web_search:
  enabled: false
  max_results: 3        # tope de resultados inyectados (default 3)
  # timeout: 10s        # tope por llamada a DDG (default 10s)

# Forward de embeddings a Ollama (011-006). base_url GLOBAL (un Ollama por
# instancia mofgw); el modelo forzado es POR CLIENTE (clients[].embeddings.model).
# api_key_env opcional (Ollama local sin key por default).
embeddings:
  base_url: "http://localhost:11434"
  # api_key_env: MOFGW_EMBEDDINGS_API_KEY

# Registro unificado de accounting + outcome (014-001): canal dedicado
# registry.jsonl con UN evento por intento (cada visita a un provider de la
# cadena) + UN evento terminal por request en routing (outcome, tokens,
# costo, streaming). Es la fuente de verdad con resolución temporal que
# telemetry.jsonl (009-000) y /metrics no cubren (no reemplaza a ninguno).
# Off por default (no crea archivo, cero costo). enabled=true + file vacío →
# error al arrancar (fail-fast). El archivo es append-only y sobrevive
# restarts. Privacidad: solo metadata del esquema, nunca prompts/respuestas.
registry:
  enabled: false
  # file: "/var/log/mofgw/registry.jsonl"
