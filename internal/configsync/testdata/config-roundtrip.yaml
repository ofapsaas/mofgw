# Seed sintético del fixture golden (spec 019-004 D8).
# Hand-authored en RED; el golden se MATERIALIZA vía el round-trip del propio
# serializer (self-consistente, D8) con aprobación HITL al cerrar GREEN-1.
#
# Composición mínima-exhaustiva (test-audit §6.1):
#   - comentarios a 4 niveles: documento / sección / key / línea (P5)
#   - flow-style + block-style en models (P6: sin mutación cosmética)
#   - scalars quoted/unquoted, durations, booleans (P6)
#   - provider subprocess completo + knobs sync_source/sync_mirror (P2)
#   - pricing/model_metadata con keys OR (`z-ai/glm-5.3-flash`) y cortas
#     coexistiendo (P4), con y sin comentario (P5)
#   - providers en orden NO alfabético = orden vivo de fallback (P2/D3)
#
# clients_file apunta al fixture complementario (relativo al cwd del test =
# paquete, cómo lo lee LoadClientsFile). Para el round-trip de Serialize es
# un string INERTE (Serialize jamás abre el archivo); solo config.
# ParseForValidation lo lee, y solo en los happy-paths de Apply (P13a/D5).
# HeadComment nivel documento (P5a) — marcador de B7 (preservación de comentarios)
server:
  addr: "127.0.0.1:3369"        # LineComment nivel key (P5a)
  max_body_bytes: 10485760
  read_timeout: 120s
  write_timeout: 300s
fallback:
  max_retries: 2
  cooldown: 60s
  cooldown_jitter: 5s
  timeout: 120s
  first_token_timeout: 75s
telemetry:
  enabled: false
  sample_rate: 1
  file: ""
registry:
  enabled: false
  file: ""
context:
  margin: 0.1
embeddings:
  base_url: "http://localhost:11434"
client_config:
  base_url: ""
  key_env: MOFGW_KEY
clients_file: "testdata/config-roundtrip-clients.yaml"
# Orden de providers = cadena de fallback — deliberadamente NO alfabético
# para congelar el orden vivo (P2/D3) contra el orden del IR (P11 de 003).
providers:
  - id: go-cuenta-1
    base_url: "https://opencode.ai/zen/go/v1"
    api_key_env: "MOFGW_GO_1_KEY"
    models: ["glm-5.2", "deepseek-flash"]   # LineComment de la lista models (P5b)
    max_tokens: 8192
    thinking_path: "zen"
    opencode_session: true
    sync_source: "zen"
    sync_mirror: "opencode-go"
  - id: auto-sin-match
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "MOFGW_DASH_KEY"
    # comentario intermedio DENTRO del provider (P5c)
    models:                                # block-style (contraparte del flow)
      - "glm-5.2"
      - "minimax-m3"
    max_tokens: 16384
  - id: sub-acc
    type: subprocess
    backend: claude
    command: "claude"
    session_dir: "~/.local/share/mofgw/sessions"
    backend_flags: ["--dangerously-skip-permissions"]
    clients: ["me"]
    models: ["claude-sonnet-4"]
pricing:
  glm-5.2:                    # entry tocada por el plan en B5/B7 (P4a/P5b)
    input_usd_per_m: 1.4      # precio verificado 2026-09 (LineComment sobre scalar que CAMBIA)
    output_usd_per_m: 4.4
    cache_hit_usd_per_m: 0.26
  minimax-m3:                 # entry tocada parcialmente (P4b: campo ausente preserva)
    input_usd_per_m: 0.3
    output_usd_per_m: 1.2
    cache_hit_usd_per_m: 0.03
  z-ai/glm-5.3-flash:         # key OR de acceso (P4) + HeadComment de entry (P5a)
    # nota de verificación de precio OR (bloque de notas)
    input_usd_per_m: 0.2
    output_usd_per_m: 1.1
    cache_hit_usd_per_m: 0.02
  qwen3.7-plus:               # entry manual corta, NUNCA tocada por el plan (P4e)
    input_usd_per_m: 0.4
    output_usd_per_m: 1.6
model_metadata:
  glm-5.2:                    # entry tocada: thinking toggle (P4c, B6)
    context_window: 200000
    max_output: 128000
    thinking: ["low", "high"]
    thinking_default: "low"
  z-ai/glm-5.3-flash:         # entry con metadata, untouched (P5a)
    context_window: 204800
    max_output: 131072
  claude-sonnet-4:            # entry manual sin comentario, intacta (P4e)
    context_window: 200000
    max_output: 32000
# FootComment nivel documento (P5a)
